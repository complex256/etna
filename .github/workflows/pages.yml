# Checks, tests and builds the viewer, then publishes dist/index.html to GitHub Pages.
# Tests that need a real catalog dump skip themselves; the rest run on the built-in demo.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Node (.node-version), pnpm (package.json devEngines) and vp (pnpm-workspace.yaml catalog).
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test run
      - run: vp exec vue-tsc -b
      # Browser tests on the built-in demo catalog (the real-dump tests skip themselves).
      - run: vp exec playwright install --with-deps chromium
      - run: vp exec playwright test
      - run: vp build
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
